services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: inventory_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: django_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DB=inventory_db
      - MONGODB_USERNAME=admin
      - MONGODB_PASSWORD=password123
    depends_on:
      - mongodb
    volumes:
      - .:/app
    networks:
      - app-network
    command: >
      sh -c "python manage.py migrate --run-syncdb &&
             python manage.py runserver 0.0.0.0:8000"

  websocket:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: websocket_server
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DEBUG=True
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DB=inventory_db
      - MONGODB_USERNAME=admin
      - MONGODB_PASSWORD=password123
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8001
    depends_on:
      - mongodb
      - web
    volumes:
      - .:/app
    networks:
      - app-network
    command: python websocket_server.py

  frontend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: frontend_server
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    networks:
      - app-network
    command: sh -c "cd /app/frontend && python -m http.server 3000"

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
