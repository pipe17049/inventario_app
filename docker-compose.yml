services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: inventory_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: django_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DB=inventory_db
      - MONGODB_USERNAME=admin
      - MONGODB_PASSWORD=password123
      - ALLOWED_HOSTS=localhost,127.0.0.1,django_web,0.0.0.0
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - app-network
    command: >
      sh -c "echo 'Waiting for MongoDB connection...' &&
             sleep 20 &&
             echo 'Testing MongoDB connection...' &&
             python -c 'import os; import mongoengine; mongoengine.connect(host=os.getenv(\"MONGODB_HOST\", \"localhost\"), port=int(os.getenv(\"MONGODB_PORT\", 27017)), db=os.getenv(\"MONGODB_DB\", \"inventory_db\"), username=os.getenv(\"MONGODB_USERNAME\"), password=os.getenv(\"MONGODB_PASSWORD\")); print(\"MongoDB connection successful\")' &&
             echo 'Starting Django migrations...' &&
             python manage.py migrate --run-syncdb &&
             echo 'Django web server starting on 0.0.0.0:8000...' &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:8000/api/health/ || exit 1"]
      interval: 45s
      timeout: 20s
      retries: 8
      start_period: 120s

  websocket:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: websocket_server
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DEBUG=True
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DB=inventory_db
      - MONGODB_USERNAME=admin
      - MONGODB_PASSWORD=password123
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8001
    depends_on:
      mongodb:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - .:/app
    networks:
      - app-network
    command: >
      sh -c "echo 'Waiting for web service to start...' &&
             sleep 60 &&
             echo 'Starting WebSocket server...' &&
             python websocket_server.py"
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -tulpn | grep :8001 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

  frontend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: frontend_server
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      web:
        condition: service_started
    volumes:
      - .:/app
    networks:
      - app-network
    command: >
      sh -c "echo 'Waiting for backend services...' &&
             sleep 40 &&
             echo 'Starting frontend server...' &&
             cd /app/frontend && python -m http.server 3000"

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
