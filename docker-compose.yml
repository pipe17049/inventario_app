services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: inventory_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: django_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DB=inventory_db
      - MONGODB_USERNAME=admin
      - MONGODB_PASSWORD=password123
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - app-network
    command: >
      sh -c "sleep 15 &&
             echo 'Starting Django web server...' &&
             python manage.py migrate --run-syncdb &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  websocket:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: websocket_server
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DEBUG=True
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DB=inventory_db
      - MONGODB_USERNAME=admin
      - MONGODB_PASSWORD=password123
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8001
    depends_on:
      mongodb:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - app-network
    command: >
      sh -c "sleep 30 &&
             echo 'Starting WebSocket server...' &&
             python websocket_server.py"
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -tulpn | grep :8001 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

  frontend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: frontend_server
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - app-network
    command: >
      sh -c "sleep 20 &&
             echo 'Starting frontend server...' &&
             cd /app/frontend && python -m http.server 3000"

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
